[package]
name = "openless-windows-tauri"
version = "0.0.1"
description = "OpenLess Windows Phase 0 spike"
edition = "2021"
rust-version = "1.77"

[lib]
name = "openless_windows_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
arboard = "3"
enigo = "0.2"
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1"
parking_lot = "0.12"
anyhow = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
